services:
  # ─── Infrastructure ────────────────────────────────────────

  # ─── Database Migration (runs once on startup) ──────────

  db-migrate:
    build:
      context: .
      dockerfile: apps/packages/core/prisma/Dockerfile.migrate
    container_name: nailbook-db-migrate
    env_file:
      - ./apps/packages/core/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nailbook-net

  # ─── Database Seed (runs once, after migrations succeed) ──

  db-seed:
    build:
      context: .
      dockerfile: apps/packages/core/prisma/Dockerfile.migrate
    container_name: nailbook-db-seed
    env_file:
      - ./apps/packages/core/.env
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # Dockerfile's default ENTRYPOINT is `pnpm exec prisma` (for migrate
    # deploy via CMD). Seeding uses a package.json script instead, so the
    # entrypoint itself needs overriding here, not just the command.
    entrypoint: ["pnpm", "db:seed"]
    networks:
      - nailbook-net

  postgres:
    image: postgres:18-alpine
    container_name: nailbook-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wannys_nails
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nailbook-net

  redis:
    image: redis:7-alpine
    container_name: nailbook-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nailbook-net

  # ─── API Server ───────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nailbook-api
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env.development
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/index.js"]
    networks:
      - nailbook-net

  # ─── Worker (conversation + payment + notification queues) ─

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: nailbook-worker
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ./apps/worker/.env
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nailbook-net

  # ─── Frontend (PWA) ──────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nailbook-web
    env_file:
      - ./apps/web/.env
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - nailbook-net

volumes:
  postgres_data:
  redis_data:

networks:
  nailbook-net:
    driver: bridge