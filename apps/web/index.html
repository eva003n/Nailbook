<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile viewport configuration -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Title -->
    <title>Nailbook - Nail salon studio</title>
    <!-- Description -->
    <meta
      name="description"
      content="Booking management for Nailbook salon — appointments, payments, and customers in one place."
    />
    <!--  Favicon Icons  -->
    <link rel="icon" href="/icons/favicon/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/favicon/apple-touch-icon.png" />

    <link
      rel="icon"
      href="/icons/favicon/favicon-32x32.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="/icons/favicon/favicon-16x16.png"
      type="image/png"
      sizes="16x16"
    />
    <link rel="mask-icon" href="/icons/logo.svg" />
    <!-- Theme color for windows title bar(Desktop) or status bar(Mobile) -->
    <meta name="theme-color" content="#FBF8F9" />
    <!-- Apply the saved theme before first paint (mirrors src/lib/theme.ts) -->
    <script>
      (function () {
        var p = "system";
        try { p = localStorage.getItem("nailbook-theme") || "system"; } catch (e) {}
        var d = p === "dark" || (p !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        r.dataset.theme = d ? "dark" : "light";
        r.style.colorScheme = d ? "dark" : "light";
        if (d) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#161015");
      })();
    </script>
    <!-- Preload the two most-used weights -->
    <link rel="preload" href="/fonts/figtree-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin-700.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
